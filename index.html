<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dan</title>
  <meta name="description" content="Dan — projects, writing, and notes." />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/fonts.css" />
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/global.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/motion.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div data-include="/partials/header.html"></div>

  <main id="main">
    <section class="container hero">
      <h1>
        <span class="hero__name">
          Dan
          <svg class="hero__name-mark" viewBox="0 0 220 26" preserveAspectRatio="none" aria-hidden="true">
            <path d="M4 16 C 40 24, 90 24, 110 14 S 190 4, 216 12" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" />
          </svg>
        </span>
      </h1>
      <p class="hero__lede">
        I build things and write about what I learn along the way — mostly
        software, security, and whatever rabbit hole I'm in this week.
      </p>
      <div class="hero__actions">
        <a class="btn btn--primary" href="/projects/">View projects</a>
        <a class="btn btn--secondary" href="/blog/">Read the blog</a>
      </div>
    </section>

    <section class="container section">
      <h2 class="section-heading">Featured projects</h2>
      <ul class="menu-list" id="featured-projects"></ul>
    </section>

    <section class="container section">
      <h2 class="section-heading">Latest writing</h2>
      <ul class="menu-list" id="latest-posts"></ul>
    </section>
  </main>

  <div data-include="/partials/footer.html"></div>

  <script src="/assets/js/include.js"></script>
  <script src="/assets/js/render-list.js"></script>
  <script>
    document.addEventListener("partials:loaded", function () {
      renderList.projects("#featured-projects", { featuredOnly: true, limit: 3 });
      renderList.posts("#latest-posts", { limit: 3 });
    });
  </script>
</body>
</html>
