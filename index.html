<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dan</title>
  <meta name="description" content="Dan — projects, writing, and notes." />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/fonts.css" />
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/global.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/motion.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div data-include="/partials/header.html"></div>

  <main id="main">
    <section class="container hero">
      <p class="hero__eyebrow">Hello, I'm</p>
      <h1>Dan</h1>
      <p class="hero__lede">
        I build things and write about what I learn along the way — mostly
        software, security, and whatever rabbit hole I'm in this week.
      </p>
      <div class="hero__actions">
        <a class="btn btn--primary" href="/projects/">View projects</a>
        <a class="btn btn--secondary" href="/blog/">Read the blog</a>
      </div>
    </section>

    <section class="container section" data-reveal>
      <div class="section-heading">
        <h2>Featured projects</h2>
        <a class="link-underline" href="/projects/">All projects &rarr;</a>
      </div>
      <div class="card-grid" id="featured-projects" data-reveal></div>
    </section>

    <section class="container section" data-reveal>
      <div class="section-heading">
        <h2>Latest writing</h2>
        <a class="link-underline" href="/blog/">All posts &rarr;</a>
      </div>
      <div class="card-grid" id="latest-posts" data-reveal></div>
    </section>
  </main>

  <div data-include="/partials/footer.html"></div>

  <script src="/assets/js/include.js"></script>
  <script src="/assets/js/reveal.js"></script>
  <script src="/assets/js/render-cards.js"></script>
  <script>
    document.addEventListener("partials:loaded", function () {
      renderCards.projects("#featured-projects", { featuredOnly: true, limit: 3 });
      renderCards.posts("#latest-posts", { limit: 3 });
    });
  </script>
</body>
</html>
